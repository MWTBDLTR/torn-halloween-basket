name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dist-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed dist matches a fresh build
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run npm run build and commit dist/."
            exit 1
          fi
